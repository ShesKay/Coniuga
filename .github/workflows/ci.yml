name: CI

on:
  push:
    branches: [master]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.13"
      - name: Abhängigkeiten installieren
        run: uv sync
      - name: Linter (ruff)
        run: uv run ruff check src tests
      - name: Formatierung prüfen
        run: uv run ruff format --check src tests
      - name: Tests (pytest)
        run: uv run pytest

  docker:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
      - name: Docker-Image bauen
        run: docker build . -t coniuga
      - name: Container starten und Health-Check prüfen
        run: |
          docker run -d -p 8000:8000 --name coniuga coniuga
          for i in $(seq 1 20); do
            curl -fs http://localhost:8000/api/health && exit 0
            sleep 1
          done
          docker logs coniuga
          exit 1
