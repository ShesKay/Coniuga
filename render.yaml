# Render Blueprint: beschreibt den Webdienst als Code.
# Render baut bei jedem Push auf master automatisch das Docker-Image und deployt es.
services:
  - type: web
    name: coniuga
    runtime: docker
    plan: free
    region: frankfurt # gleiche Region wie die Datenbank bei Neon; nach dem Anlegen nicht mehr änderbar
    branch: master
    autoDeploy: true
    healthCheckPath: /api/health
    envVars:
      - key: DATABASE_URL
        sync: false # wird im Render-Dashboard gesetzt (Verbindungs-URL von Neon)
